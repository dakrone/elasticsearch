import org.elasticsearch.gradle.OS

apply plugin: 'elasticsearch.internal-yaml-rest-test'
apply plugin: 'elasticsearch.yaml-rest-compat-test'
apply plugin: 'elasticsearch.internal-cluster-test'

esplugin {
  description = 'Ingest plugin for OTel-formatted data'
  classname ='org.elasticsearch.ingest.otel.IngestOTelPlugin'

  bundleSpec.from("${project.buildDir}/ingest-otel") {
    into '/'
  }
}

tasks.named('internalClusterTestTestingConventions').configure {
  baseClass 'org.elasticsearch.test.ESTestCase'
}

